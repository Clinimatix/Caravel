name: Build Clinimatix Caravel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - name: Restore serviced graph and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore Caravel.slnx --force-evaluate
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build Caravel.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
      - name: Prove recipient regressions against previous implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = 'src/Caravel.Auth/AccountEndpointExtensions.cs'
          $fixed = Get-Content $file -Raw
          try {
            git show v26.1.2-rc2:src/Caravel.Auth/AccountEndpointExtensions.cs | Set-Content $file
            if ($LASTEXITCODE -ne 0) { throw 'Baseline source unavailable.' }
            dotnet test tests/Caravel.Identity.Tests -c Release --no-restore --filter 'FullyQualifiedName~Recovery_mail_' --logger 'trx;LogFileName=recipient-baseline.trx'
            if ($LASTEXITCODE -eq 0) { throw 'Regression tests unexpectedly pass old implementation.' }
            [xml]$trx = Get-Content tests/Caravel.Identity.Tests/TestResults/recipient-baseline.trx -Raw
            if ([int]$trx.TestRun.ResultSummary.Counters.failed -ne 4 -or [int]$trx.TestRun.ResultSummary.Counters.passed -ne 1) { throw 'Unexpected baseline regression results.' }
          } finally { Set-Content $file $fixed -NoNewline }
      - name: Verify repaired Identity behavior
        shell: pwsh
        run: |
          dotnet test tests/Caravel.Identity.Tests -c Release --no-restore --logger 'trx;LogFileName=recipient-fixed.trx'
          if ($LASTEXITCODE -ne 0) { throw 'Repaired Identity tests failed.' }
          New-Item -ItemType Directory -Force artifacts/servicing-locks | Out-Null
          git ls-files '*packages.lock.json' | ForEach-Object {
            $target = Join-Path 'artifacts/servicing-locks' $_
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            Copy-Item $_ $target
          }
          @{commit=$env:GITHUB_SHA;run=$env:GITHUB_RUN_ID;sdk=(dotnet --version)} | ConvertTo-Json | Set-Content artifacts/servicing-locks/provenance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: security-servicing-preparation
          path: |
            artifacts/servicing-locks
            tests/Caravel.Identity.Tests/TestResults/*.trx
          if-no-files-found: error
