name: Build Clinimatix Caravel
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify
        type: choice
        options: [windows-latest]
        default: windows-latest
      experimental:
        description: Reserved for the standard verification workflow
        type: boolean
        default: false
concurrency:
  group: caravel-verification-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sqlclient-preparation:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'
      - name: Record toolchain and source
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts/sqlclient-preparation -Force | Out-Null
          $sdk = (dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $sdk -ne '10.0.403') { throw "Unexpected SDK: $sdk" }
          dotnet --info | Tee-Object artifacts/sqlclient-preparation/dotnet-info.txt
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain inventory failed.' }
          git rev-parse HEAD | Set-Content artifacts/sqlclient-preparation/source-sha.txt
          if ($LASTEXITCODE -ne 0) { throw 'Source inventory failed.' }
      - name: Regenerate and validate dependency locks
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore Caravel.slnx --force-evaluate
          if ($LASTEXITCODE -ne 0) { throw 'Dependency lock regeneration failed.' }
          dotnet restore Caravel.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          $lockRoot = Join-Path $PWD 'artifacts/sqlclient-preparation/locks'
          $locks = @(git ls-files '*packages.lock.json')
          if ($LASTEXITCODE -ne 0 -or $locks.Count -eq 0) { throw 'Tracked lock inventory failed.' }
          foreach ($path in $locks) {
            $target = Join-Path $lockRoot $path
            New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null
            Copy-Item -LiteralPath $path -Destination $target
          }
          git diff --stat | Set-Content artifacts/sqlclient-preparation/lock-diff-stat.txt
      - name: Build and test dependency integration
        run: |
          dotnet build Caravel.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Solution build failed.' }
          dotnet test tests/Caravel.Provider.Tests/Caravel.Provider.Tests.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~SqlClientSecurityTests --logger 'trx;LogFileName=provider.trx' --results-directory artifacts/sqlclient-preparation/tests
          if ($LASTEXITCODE -ne 0) { throw 'SqlClient integration regressions failed.' }
          dotnet test tests/Caravel.Bosun.Tests/Caravel.Bosun.Tests.csproj -c Release --no-build --no-restore --logger 'trx;LogFileName=bosun.trx' --results-directory artifacts/sqlclient-preparation/tests
          if ($LASTEXITCODE -ne 0) { throw 'Starter generation tests failed.' }
      - name: Compare vulnerable and fixed packages
        run: |
          ./tests/fixtures/SqlClientSecurity/Invoke-Differential.ps1 -DotnetPath (Get-Command dotnet).Source -ApprovedSdkVersion '10.0.403' -OutputRoot (Join-Path $env:RUNNER_TEMP 'sqlclient-differential')
      - name: Verify installed Identity starter
        run: |
          $starterTemp = [IO.Path]::GetTempPath()
          $before = @(Get-ChildItem -LiteralPath $starterTemp -Directory -Filter 'caravel identity starter *' | Select-Object -ExpandProperty FullName)
          $smokePassed = $false
          try {
            ./scripts/Test-IdentityStarterSmoke.ps1
            $smokePassed = $true
          } finally {
            $created = @(Get-ChildItem -LiteralPath $starterTemp -Directory -Filter 'caravel identity starter *' | Where-Object FullName -NotIn $before)
            if ($created.Count -ne 1) { throw 'Expected exactly one generated Identity qualification directory.' }
            foreach ($run in $created) {
              $target = Join-Path $PWD ('artifacts/sqlclient-preparation/identity/' + $run.Name)
              New-Item -ItemType Directory -Path $target -Force | Out-Null
              $results = Join-Path $run.FullName 'results'
              if ($smokePassed -and (-not (Test-Path -LiteralPath $results) -or @(Get-ChildItem -LiteralPath $results -Filter '*.trx' -File).Count -eq 0)) { throw 'Passing Identity qualification must retain TRX evidence.' }
              if (Test-Path -LiteralPath $results) {
                Get-ChildItem -LiteralPath $results -Filter '*.trx' -File | Copy-Item -Destination $target
              }
              $project = Join-Path $run.FullName 'Workbench/Workbench.csproj'
              if (Test-Path -LiteralPath $project) { Copy-Item -LiteralPath $project -Destination $target }
              $assets = Join-Path $run.FullName 'Workbench/obj/project.assets.json'
              if (Test-Path -LiteralPath $assets) {
                ((Get-Content -LiteralPath $assets -Raw | ConvertFrom-Json).libraries.PSObject.Properties.Name | Where-Object { $_ -like 'Microsoft.Data.SqlClient/*' }) | Set-Content -LiteralPath (Join-Path $target 'resolved-sqlclient.txt')
              }
            }
          }
      - name: Collect differential evidence
        if: always()
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'sqlclient-differential'
          if (Test-Path -LiteralPath $root) {
            $target = Join-Path $PWD 'artifacts/sqlclient-preparation/differential'
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            if (Test-Path -LiteralPath "$root/differential.json") { Copy-Item -LiteralPath "$root/differential.json" -Destination $target }
            foreach ($version in @('6.1.7','6.1.8')) {
              $lane = Join-Path $target $version
              New-Item -ItemType Directory -Path $lane -Force | Out-Null
              foreach ($file in @('dotnet-info.txt','restore.txt','locked-restore.txt','build.txt','test.txt','packages.lock.json','evidence/results.trx')) {
                $source = Join-Path "$root/$version" $file
                if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination $lane }
              }
            }
          }
      - name: Retain dependency qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: caravel-sqlclient-preparation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/sqlclient-preparation
          if-no-files-found: error
          retention-days: 14
